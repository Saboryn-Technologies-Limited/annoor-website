<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Annoor Online Admission Portal</title>
<style>
:root{--bg:#f6f7f3;--card:#fff;--tx:#17241c;--mu:#5d6b62;--g:#0f5b3a;--gold:#c8a24a;--bd:#dfe4dc;--err:#b3261e;--ok:#157a43;--wn:#fff4d6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1511;--card:#16211b;--tx:#e8efe9;--mu:#9bac9f;--g:#2b9a64;--bd:#263329;--err:#ff8a80;--ok:#5fd394;--wn:#3a3216}}
:root[data-theme=dark]{--bg:#0d1511;--card:#16211b;--tx:#e8efe9;--mu:#9bac9f;--g:#2b9a64;--bd:#263329;--err:#ff8a80;--ok:#5fd394;--wn:#3a3216}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}header{background:var(--g);color:#fff;border-bottom:3px solid var(--gold)}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.hd small{display:block;opacity:.85}
main{padding:20px 16px}h2{margin:.2em 0 .4em}h3{margin:1.2em 0 .3em;color:var(--g)}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
button,.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:600 16px inherit;cursor:pointer;margin:6px 6px 6px 0}
button.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}button.lnk{background:none;color:#fff;padding:6px;margin:0;text-decoration:underline}button.s{padding:6px 10px;font-size:14px}button.r{background:var(--err)}
label{display:block;margin:10px 0;font-weight:600}input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:16px inherit}
label.ck{display:flex;gap:10px;font-weight:400}label.ck input{width:20px;margin:3px 0 0}
.note{background:var(--wn);border:1px solid var(--gold);border-radius:10px;padding:12px;margin:12px 0}.err{color:var(--err);min-height:1.4em}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px;font-size:14px}.box b{display:block}.box.ok{border-color:var(--ok)}.box.ok span{color:var(--ok)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.sw{font-size:18px;padding:14px 20px}.pill{padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-size:13px}footer{color:var(--mu);font-size:13px;padding:20px 16px}
.hd{flex-wrap:wrap;gap:8px}nav{white-space:nowrap}nav a{color:#fff;margin-left:14px;font-weight:600;cursor:pointer}footer p{margin:4px 0}footer a{color:var(--g);font-weight:600}
.hero{text-align:center;padding:24px 0 8px}.logo{width:96px;height:96px;border-radius:50%;border:2px dashed var(--gold);display:grid;place-items:center;margin:0 auto 12px;color:var(--mu);font-size:12px;overflow:hidden;background:var(--card)}.logo img{width:100%;height:100%;object-fit:cover}.hero h1{font-size:28px;line-height:1.2;margin:.2em 0;color:var(--g)}
.gal,.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ph{aspect-ratio:4/3;border:1.5px dashed var(--bd);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--mu);overflow:hidden;position:relative;background:var(--card);padding:6px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.ph b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;font-size:13px}
.ach div{border-left:3px solid var(--gold);padding:4px 10px}.ach b{display:block;font-size:22px;color:var(--g)}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}.mdl>div{background:var(--card);color:inherit;border-radius:14px;padding:20px;max-width:420px;width:100%}.mdl .row{display:flex;gap:10px;margin-top:14px}
.pw{position:relative;display:block}.pw input{padding-right:48px}.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);padding:8px 10px;width:auto;min-height:0;cursor:pointer;line-height:0}
.alt{text-align:center;margin:14px 0 0}.alt a{color:var(--g);font-weight:600;cursor:pointer}label small{display:block;margin-top:4px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== CONFIG: leave blank for DEMO mode. Fill in later to go LIVE. =====
const CFG={SUPABASE_URL:'https://fsllqngaecezxuqrjrdm.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_xCEv4mDWwGxZ6fqv8YOsVQ_6pMpPTDj'};
const SCHOOL='Annoor International Islamic Academy';
const SITE='https://saboryn-technologies-limited.github.io/Saboryn-technologies-limited-/';
// ===== SCHOOL DETAILS: replace the [brackets]. For photos, upload them to a "photos" folder and write e.g. src:'photos/pitch.jpg' =====
const SCH={logo:'',address:'[School address, Bauchi]',phone:'[School phone]',
photos:[{t:'Our students',src:''},{t:'CBT and ICT centre',src:''},{t:'Science laboratory',src:''},{t:'Football pitch',src:''},{t:'Playground',src:''},{t:'Nursery pupils',src:''},{t:'Primary pupils',src:''},{t:'Secondary students',src:''}],
ach:[['[number]','Years of service'],['[number]','Students enrolled'],['[achievement]','Award or result'],['[achievement]','Competition or milestone']]};
const LIVE=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY);
const app=document.getElementById('app');let sb,U=null,P=null,PEND='',LAST='',MAILED=null;
let ST={applications_open:true,fee_kobo:500000,closing_date:null,closed_message:'Applications are currently closed. Please check back later.',interview_time:'9:00 AM',interview_venue:'',interview_lead_days:5,interview_per_day:20,interview_bring:''};
const naira=k=>'\u20a6'+(k/100).toLocaleString('en-NG');
const OPEN=()=>ST.applications_open&&(!ST.closing_date||new Date().toISOString().slice(0,10)<=ST.closing_date);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'';
function ask(t,m,ok){return new Promise(r=>{const d=document.createElement('div');d.className='mdl';d.innerHTML=`<div><h3>${esc(t)}</h3><p>${esc(m)}</p><div class="row"><button id="y">${esc(ok||'Confirm')}</button><button class="o" id="n">Go back</button></div></div>`;document.body.appendChild(d);const c=v=>{d.remove();r(v)};d.querySelector('#y').onclick=()=>c(true);d.querySelector('#n').onclick=()=>c(false)})}
const REC=/type=recovery/.test(location.hash);
const EYE='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>',EYE_OFF='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
function eye(b){const i=b.previousElementSibling,show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?EYE_OFF:EYE;b.setAttribute('aria-label',show?'Hide password':'Show password')}
function pwf(n,l,hint,ac){return`<label>${l}<span class="pw"><input name="${n}" type="password" required autocomplete="${ac}"${hint?' minlength="8"':''}><button type="button" class="eye" onclick="eye(this)" aria-label="Show password">${EYE}</button></span>${hint?'<small class="mu">'+hint+'</small>':''}</label>`}
const go=h=>{if(location.hash==='#/'+h)route();else location.hash='#/'+h};
const D={users:[{id:'admin',email:'admin@annoor.demo',pw:'admin123',verified:true,is_admin:true,full_name:'School Admin',phone:'-'}],payments:[],apps:[]};
const A=LIVE?{
async init(){sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);const{data}=await sb.auth.getSession();U=data.session?data.session.user:null;await A.load()},
async load(){const{data:s}=await sb.from('settings').select('*').eq('id',1).single();if(s)ST=s;P=null;if(U){const{data:p}=await sb.from('profiles').select('*').eq('id',U.id).single();P=p}},
async signUp(n,e,ph,pw){const{error}=await sb.auth.signUp({email:e,password:pw,options:{data:{full_name:n,phone:ph},emailRedirectTo:location.origin+location.pathname}});if(error)throw error},
async resetPw(e){const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});if(error)throw error},
async setPw(pw){const{error}=await sb.auth.updateUser({password:pw});if(error)throw error},
async signIn(e,pw){const{error}=await sb.auth.signInWithPassword({email:e,password:pw});if(error)throw error;U=(await sb.auth.getUser()).data.user;await A.load()},
async signOut(){await sb.auth.signOut();U=P=null},
async mine(){const r=await Promise.all([sb.from('payments').select('*').eq('user_id',U.id).order('created_at'),sb.from('applications').select('*').eq('user_id',U.id)]);return{pay:r[0].data||[],apps:r[1].data||[]}},
async pay(){const{data,error}=await sb.functions.invoke('create-payment');if(error||!data||!data.authorization_url)throw new Error((data&&data.error)||'Could not start payment. Please try again.');location.href=data.authorization_url},
async verify(ref){const{data,error}=await sb.functions.invoke('verify-payment',{body:{reference:ref}});if(error)throw error;return data.status},
async submit(row,files){for(const k of['photo','birth']){const f=files[k];if(f&&f.size){const path=U.id+'/'+k+'-'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');const{error}=await sb.storage.from('documents').upload(path,f);if(error)throw error;row[k==='photo'?'photo_path':'birth_certificate_path']=path}}
 row.user_id=U.id;const{data,error}=await sb.from('applications').insert(row).select().single();if(error)throw error;return data},
async admin(){const r=await Promise.all([sb.from('payments').select('*').order('created_at',{ascending:false}),sb.from('applications').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('*')]);return{pay:r[0].data||[],apps:r[1].data||[],prof:r[2].data||[]}},
async setStatus(id,s){await sb.from('applications').update({status:s}).eq('id',id)},
async mail(a,id){try{const{data,error}=await sb.functions.invoke('application-mail',{body:{action:a,application_id:id}});return!error&&data&&data.ok?data:null}catch(x){return null}},
async saveSettings(o){const{error}=await sb.from('settings').update(o).eq('id',1);if(error)throw error;Object.assign(ST,o)},
async doc(p){const{data}=await sb.storage.from('documents').createSignedUrl(p,300);window.open(data.signedUrl,'_blank')}
}:{
async init(){},async load(){},
async signUp(n,e,ph,pw){if(D.users.find(u=>u.email===e))throw new Error('This email is already registered.');D.users.push({id:'u'+D.users.length,email:e,full_name:n,phone:ph,pw,verified:false,is_admin:false})},
async resetPw(e){},
async setPw(pw){const u=D.users.find(x=>U&&x.id===U.id);if(u)u.pw=pw},
async signIn(e,pw){const u=D.users.find(x=>x.email===e&&x.pw===pw);if(!u)throw new Error('Invalid email or password.');if(!u.verified)throw new Error('Please verify your email first.');U=P=u},
async signOut(){U=P=null},
async mine(){return{pay:D.payments.filter(p=>p.user_id===U.id),apps:D.apps.filter(a=>a.user_id===U.id)}},
async pay(){if(!OPEN())throw new Error(ST.closed_message);const ref='DEMO-'+Date.now();D.payments.push({id:'p'+ref,user_id:U.id,reference:ref,amount_kobo:ST.fee_kobo,status:'PENDING',created_at:new Date().toISOString()});go('verify/'+ref)},
async verify(ref){const p=D.payments.find(x=>x.reference===ref);return p?p.status:'FAILED'},
async submit(row){row.id='a'+D.apps.length;row.user_id=U.id;row.application_number='ANR/1448/'+String(D.apps.length+1).padStart(4,'0');row.status='Submitted';row.created_at=new Date().toISOString();D.apps.push(row);return row},
async admin(){return{pay:D.payments,apps:D.apps,prof:D.users}},
async setStatus(id,s){D.apps.find(a=>a.id===id).status=s},
async mail(a,id){const x=D.apps.find(p=>p.id===id);if(a==='approve'&&x){const d=new Date(Date.now()+864e5*(ST.interview_lead_days||5));while(d.getDay()%6===0)d.setDate(d.getDate()+1);x.status='Approved';x.registration_number='ANR/2026/'+String(D.apps.indexOf(x)+1).padStart(4,'0');x.interview_date=d.toISOString().slice(0,10);x.interview_time=ST.interview_time;return{ok:true,emailed:false,interview_date:x.interview_date}}return{ok:true,emailed:false}},
async saveSettings(o){Object.assign(ST,o)},async doc(){alert('Documents are available in live mode.')}};
const card=(t,p,b)=>`<div class="card"><h2>${t}</h2><p>${p}</p>${b||''}</div>`;
const banner=()=>OPEN()?'':`<div class="note"><b>Applications closed.</b> ${esc(ST.closed_message)}</div>`;
function shell(x){const r=location.hash.replace(/^#\/?/,'').split('/')[0]||'home';app.innerHTML=`<header><div class="wrap hd"><div><b>${SCHOOL}</b><small>${r==='home'?'Welcome':'Online Admission Portal'}${LIVE?'':' \u00b7 DEMO MODE'}</small></div><nav><a onclick="go('home')">Home</a><a onclick="go('${U?'dash':'register'}')">${U?'Dashboard':'Apply'}</a>${U?'<a onclick="F.out()">Log out</a>':'<a onclick="go(\'login\')">Log in</a>'}</nav></div></header><main class="wrap">${x}</main><footer class="wrap"><p>\u00a9 ${SCHOOL}. Parents\u2019 data is used only for admissions. <span style="opacity:.7">Portal v4</span></p><p>Powered by <a href="${SITE}" target="_blank" rel="noopener">SABORYN TECHNOLOGIES LIMITED</a> \u00b7 <a onclick="go('admin-login')" style="cursor:pointer">Staff login</a></p></footer>`}
const R={};
R.home=()=>`<section class="hero"><div class="logo">${SCH.logo?`<img src="${esc(SCH.logo)}" alt="${SCHOOL} logo">`:'School logo'}</div><h1>${SCHOOL}</h1><p class="mu">${esc(SCH.address)}<br>${esc(SCH.phone)}</p><button class="sw" onclick="go('register')">Apply online</button></section>${banner()}
<div class="card"><h3>How it works</h3><ol><li>Create your account and verify your email</li><li>Pay the application fee (${naira(ST.fee_kobo)}) securely on Paystack</li><li>Fill in the admission form and upload documents</li><li>Receive your application number and a confirmation email</li></ol><button onclick="go('register')">Start your application</button></div>
<div class="card"><h3>Welcome</h3><p>${SCHOOL} nurtures faith, knowledge and good character in every child, from nursery to secondary school. Our teachers work closely with parents so that each pupil learns, grows and is proud of who they are.</p></div>
<h3>Life at our school</h3><div class="gal">${SCH.photos.map(p=>`<div class="ph">${p.src?`<img src="${esc(p.src)}" alt="${esc(p.t)}"><b>${esc(p.t)}</b>`:'Photo: '+esc(p.t)}</div>`).join('')}</div>
<h3>Our achievements</h3><div class="ach">${SCH.ach.map(a=>`<div><b>${esc(a[0])}</b>${esc(a[1])}</div>`).join('')}</div>
<h3>Why parents choose us</h3><div class="card"><ul><li>Islamic and academic learning side by side</li><li>Facilities including a CBT and ICT centre, laboratory, playground and football pitch</li><li>Caring teachers from nursery to secondary</li><li>Simple online admission from your phone</li></ul></div>
<div class="card"><h3>Admission 2026/2027</h3><p class="mu">Applying takes a few minutes.</p><button onclick="go('register')">Start your application</button></div>`;
R.apply=()=>R.register();
R['admin-login']=()=>`<form class="card" onsubmit="return F.alog(event)"><h2>Staff login</h2><p class="mu">For school administrators only.</p><label>Email<input name="email" type="email" required></label>${pwf('pw','Password','','current-password')}<p class="err" id="err"></p><button>Log in</button><button type="button" class="o" onclick="go('home')">Back</button>${LIVE?'':'<p class="mu">Demo admin: admin@annoor.demo / admin123</p>'}</form>`;
R.register=()=>{if(U)return R.dash();return`<form class="card" onsubmit="return F.reg(event)"><h2>Create account</h2><p class="mu">Step 1: create your parent account. It takes about one minute.</p><label>Parent/guardian full name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required></label>${pwf('pw','Password','At least 8 characters','new-password')}${pwf('pw2','Confirm password','','new-password')}<p class="err" id="err"></p><button>Register</button><p class="alt">Already have an account? <a onclick="go('login')">Sign in</a></p></form>`};
R.check=()=>card('Check your email',`We sent a verification link to <b>${esc(PEND)}</b>. Click it, then log in. You cannot log in until your email is verified.`,LIVE?'<button onclick="go(\'login\')">Go to login</button>':'<button onclick="F.vfy()">Demo: simulate clicking the link</button>');
R.login=()=>{if(U)return R.dash();return`<form class="card" onsubmit="return F.log(event)"><h2>Sign in</h2><label>Email<input name="email" type="email" autocomplete="email" required></label>${pwf('pw','Password','','current-password')}<p class="alt" style="text-align:right;margin:0"><a onclick="go('forgot')">Forgot password?</a></p><p class="err" id="err"></p><button>Sign in</button><p class="alt">New here? <a onclick="go('register')">Create an account</a></p></form>`};
R.forgot=()=>`<form class="card" onsubmit="return F.forgot(event)"><h2>Reset your password</h2><p class="mu">Enter your email and we will send you a link to set a new password.</p><label>Email<input name="email" type="email" autocomplete="email" required></label><p class="err" id="err"></p><button>Send reset link</button><p class="alt"><a onclick="go('login')">Back to sign in</a></p></form>`;
R.forgotsent=()=>card('Check your email','If this email is registered, a reset link has been sent. Please check your inbox and your spam folder.','<button onclick="go(\'login\')">Back to sign in</button>');
R.newpw=()=>`<form class="card" onsubmit="return F.newpw(event)"><h2>Set a new password</h2>${pwf('pw','New password','At least 8 characters','new-password')}${pwf('pw2','Confirm new password','','new-password')}<p class="err" id="err"></p><button>Save new password</button></form>`;
R.pwok=()=>card('Password updated \u2713','Your password has been changed.','<button onclick="go(\'dash\')">Continue</button>');
R.dash=async()=>{if(P&&P.is_admin)return R.admin();const m=await A.mine(),used=new Set(m.apps.map(a=>a.payment_id)),ready=m.pay.filter(p=>p.status==='PAID'&&!used.has(p.id)),pend=m.pay.filter(p=>p.status==='PENDING'),paid=m.pay.some(p=>p.status==='PAID');
return `<h2>Assalamu alaikum, ${esc(P&&P.full_name)}</h2>${banner()}<div class="boxes"><div class="box ok"><b>Email</b><span>Verified \u2713</span></div><div class="box ${paid?'ok':''}"><b>Payment</b><span>${paid?'Paid \u2713':'Not paid yet'}</span></div><div class="box ${m.apps.length?'ok':''}"><b>Form</b><span>${m.apps.length?'Submitted \u2713':ready.length?'Ready':'Locked'}</span></div></div>
${ready.map(p=>`<div class="card"><b>Payment confirmed</b><p class="mu">Ref ${esc(p.reference)}</p><button onclick="go('form/${p.id}')">Fill application form</button></div>`).join('')}
${pend.map(p=>`<div class="note">Payment ${esc(p.reference)} is not confirmed. <button class="s o" onclick="go('verify/${p.reference}')">Check status</button></div>`).join('')}
${OPEN()?`<button class="${ready.length?'o':''}" onclick="go('pay')">Pay application fee (${naira(ST.fee_kobo)})${m.apps.length||ready.length?' for another child':''}</button>`:''}
${m.apps.length?'<h3>My applications</h3>'+m.apps.map(a=>`<div class="card"><b>${esc(a.application_number)}</b><br>${esc(a.student_name)} \u00b7 ${esc(a.class_applied)}<br><span class="pill">${esc(a.status)}</span>${a.registration_number?`<p>Registration number: <b>${esc(a.registration_number)}</b><br>Interview: <b>${fd(a.interview_date)}</b> at ${esc(a.interview_time||'')}<br><span class="mu">Please keep this number safe.</span></p>`:''}</div>`).join(''):''}`};
R.pay=()=>card('Pay application fee',`Amount: <b>${naira(ST.fee_kobo)}</b>. You will pay on Paystack with card, bank transfer, USSD or Opay. One payment covers one child.`,`<p class="err" id="err"></p><button onclick="F.pay()">Pay with Paystack</button><button class="o" onclick="go('dash')">Back</button>`);
R.verify=async ref=>{const s=await A.verify(ref);if(s==='PAID')return card('Payment confirmed \u2713','JazakAllahu Khairan. Your payment is verified. You can now fill the application form.','<button onclick="go(\'dash\')">Continue</button>');
if(!LIVE&&s==='PENDING')return card('Paystack checkout (demo)',`Amount: ${naira(ST.fee_kobo)}`,`<button onclick="F.sim('${ref}')">Simulate successful payment</button>`);
return card('Payment not confirmed yet','If money was deducted, wait a minute and check again.','<button onclick="route()">Check again</button><button class="o" onclick="go(\'dash\')">Back</button>')};
R.form=async pid=>{const m=await A.mine(),p=m.pay.find(x=>x.id===pid&&x.status==='PAID');if(!p||m.apps.some(a=>a.payment_id===pid))return card('Not available','This payment has no open application form.','<button onclick="go(\'dash\')">Back</button>');
const CL=['Nursery 1','Nursery 2','Nursery 3','Primary 1','Primary 2','Primary 3','Primary 4','Primary 5','Primary 6','JSS 1','JSS 2','JSS 3','SS 1','SS 2','SS 3'];
return `<form class="card" onsubmit="return F.sub(event,'${pid}')"><h2>Application form</h2><h3>A. Student information</h3><label>Student full name<input name="student_name" required></label><label>Date of birth<input name="date_of_birth" type="date" required></label><label>Gender<select name="gender" required><option>Male</option><option>Female</option></select></label><label>Class applied for<select name="class_applied" required>${CL.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Hifz level (if any)<input name="hifz_level"></label><label>Previous school<input name="previous_school"></label>
<h3>B. Parent information</h3><label>Father/Mother/Guardian name<input name="parent_name" required></label><label>Phone number<input name="parent_phone" type="tel" required></label><label>Home address<textarea name="address" rows="3" required></textarea></label>
<h3>C. Documents</h3><p class="mu">Photos are resized automatically, so large phone pictures are fine.</p><label>Passport photograph<input name="photo" type="file" accept="image/*" required></label><label>Birth certificate (photo)<input name="birth" type="file" accept="image/*,application/pdf" required></label><label class="ck"><input type="checkbox" name="consent" required><span>I confirm the information is correct and I consent to ${SCHOOL} using it for admission purposes.</span></label><p class="err" id="err"></p><button>Submit application</button></form>`};
R.done=()=>card('JazakAllahu Khairan \u2713',`Your application has been received and is being processed. The school will get back to you soon.${MAILED&&MAILED.emailed?'<br>A confirmation email has been sent to you. If you cannot see it, please check your spam or junk folder.':''}<br>Application number: <b>${esc(LAST)}</b><br>Please keep this number.`,'<button onclick="go(\'dash\')">Back to dashboard</button>');
R.admin=async()=>{if(!P||!P.is_admin)return card('Not authorised','Admin access only.');const d=await A.admin(),pm={};d.prof.forEach(x=>pm[x.id]=x);const nm=id=>esc((pm[id]||{}).full_name||'-');
return `<h2>Admin</h2><div class="card"><h3>Applications: ${ST.applications_open?'OPEN':'CLOSED'}</h3><button class="sw ${ST.applications_open?'r':''}" onclick="F.tog()">${ST.applications_open?'Close applications':'Open applications'}</button>
<form onsubmit="return F.set(event)"><label>Application fee (\u20a6)<input name="fee" type="number" min="0" value="${ST.fee_kobo/100}"></label><label>Closing date (optional)<input name="date" type="date" value="${ST.closing_date||''}"></label><label>Message shown when closed<textarea name="msg" rows="2">${esc(ST.closed_message)}</textarea></label><h3>Interview settings</h3><label>Interview time<input name="itime" value="${esc(ST.interview_time||'')}"></label><label>Venue<input name="ivenue" value="${esc(ST.interview_venue||'')}" placeholder="School address"></label><label>Earliest interview (days after approval)<input name="ilead" type="number" min="1" value="${ST.interview_lead_days||5}"></label><label>Interviews per day<input name="icap" type="number" min="1" value="${ST.interview_per_day||20}"></label><label>What to bring (one item per line)<textarea name="ibring" rows="5">${esc(ST.interview_bring||'')}</textarea></label><button class="o">Save settings</button></form></div>
<div class="boxes"><div class="box"><b>${d.apps.length}</b>Applications</div><div class="box"><b>${d.pay.filter(p=>p.status==='PAID').length}</b>Paid</div><div class="box"><b>${d.apps.filter(a=>a.status==='Approved').length}</b>Approved</div></div>
<h3>Applications</h3><button class="s o" onclick="F.csv()">Export Excel (CSV)</button><div class="sc"><table><tr><th>No.</th><th>Student</th><th>Class</th><th>Parent phone</th><th>Status</th><th></th></tr>${d.apps.map(a=>`<tr><td>${esc(a.application_number)}</td><td>${esc(a.student_name)}</td><td>${esc(a.class_applied)}</td><td>${esc(a.parent_phone)}</td><td>${esc(a.status)}${a.registration_number?'<br>'+esc(a.registration_number)+'<br>'+esc(a.interview_date||''):''}</td><td>${a.status!=='Approved'?`<button class="s" onclick="F.st('${a.id}','Approved')">Approve</button>`:`<button class="s o" onclick="F.rs('${a.id}')">Resend email</button>`}<button class="s r" onclick="F.st('${a.id}','Rejected')">Reject</button>${a.photo_path?`<button class="s o" onclick="F.doc('${esc(a.photo_path)}')">Photo</button>`:''}${a.birth_certificate_path?`<button class="s o" onclick="F.doc('${esc(a.birth_certificate_path)}')">Cert</button>`:''}</td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table></div>
<h3>Payments</h3><div class="sc"><table><tr><th>Parent</th><th>Reference</th><th>Amount</th><th>Status</th><th>Date</th></tr>${d.pay.map(p=>`<tr><td>${nm(p.user_id)}</td><td>${esc(p.reference)}</td><td>${naira(p.amount_kobo)}</td><td>${esc(p.status)}</td><td>${esc((p.created_at||'').slice(0,10))}</td></tr>`).join('')||'<tr><td>None yet</td></tr>'}</table></div>`};
function shrink(f,max){if(!f||!f.type||f.type.indexOf('image/')!==0)return Promise.resolve(f);
 return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas'),x=c.getContext('2d');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):no(),'image/jpeg',0.8)};im.onerror=()=>no();im.src=u})}
const F={err:m=>{const e=document.getElementById('err');if(e)e.textContent=m},
async reg(e){e.preventDefault();const f=new FormData(e.target),em=f.get('email').trim().toLowerCase();if(f.get('pw')!==f.get('pw2')){F.err('Passwords do not match.');return false}try{await A.signUp(f.get('name'),em,f.get('phone'),f.get('pw'));PEND=em;go('check')}catch(x){F.err(x.message)}return false},
vfy(){const u=D.users.find(x=>x.email===PEND);if(u)u.verified=true;go('login')},
async forgot(e){e.preventDefault();const f=new FormData(e.target);try{await A.resetPw(f.get('email').trim().toLowerCase());go('forgotsent')}catch(x){F.err(x.message)}return false},
async newpw(e){e.preventDefault();const f=new FormData(e.target);if(f.get('pw')!==f.get('pw2')){F.err('Passwords do not match.');return false}try{await A.setPw(f.get('pw'));go('pwok')}catch(x){F.err(x.message)}return false},
async log(e){e.preventDefault();const f=new FormData(e.target);try{await A.signIn(f.get('email').trim().toLowerCase(),f.get('pw'));go('dash')}catch(x){F.err(/confirm/i.test(x.message)?'Please verify your email first. Check your inbox.':x.message)}return false},
async alog(e){e.preventDefault();const f=new FormData(e.target);try{await A.signIn(f.get('email').trim().toLowerCase(),f.get('pw'));if(!(P&&P.is_admin)){await A.signOut();F.err('This account does not have admin access.');return false}go('dash')}catch(x){F.err(x.message)}return false},
async out(){await A.signOut();go('home')},
async pay(){try{await A.pay()}catch(x){F.err(x.message)}},
sim(ref){D.payments.find(p=>p.reference===ref).status='PAID';route()},
async sub(e,pid){e.preventDefault();if(!await ask('Submit application?','Once submitted, this cannot be changed or undone. Please check that every detail and document is correct.','Yes, submit'))return false;const f=new FormData(e.target),row={payment_id:pid,consent:true},files={photo:f.get('photo'),birth:f.get('birth')};
 for(const k of['student_name','date_of_birth','gender','class_applied','hifz_level','previous_school','parent_name','parent_phone','address'])row[k]=f.get(k);
 try{files.photo=await shrink(files.photo,1000);files.birth=await shrink(files.birth,1600)}catch(x){F.err('Could not read the image. Please choose another file.');return false}
 if((files.photo.size>5e6)||(files.birth.size>5e6)){F.err('Each file must be under 5 MB.');return false}
 try{const r=await A.submit(row,files);LAST=r.application_number;MAILED=await A.mail('received',r.id);go('done')}catch(x){F.err(x.message)}return false},
async tog(){const o=ST.applications_open;if(!await ask(o?'Close applications?':'Open applications?',o?'Parents will not be able to pay or apply until you open it again.':'Parents will be able to pay and apply straight away.',o?'Yes, close':'Yes, open'))return;await A.saveSettings({applications_open:!o});route()},
async set(e){e.preventDefault();const f=new FormData(e.target);if(!await ask('Save settings?','These changes apply to all parents straight away.','Yes, save'))return false;try{await A.saveSettings({fee_kobo:Math.round(Number(f.get('fee'))*100),closing_date:f.get('date')||null,closed_message:f.get('msg'),interview_time:f.get('itime'),interview_venue:f.get('ivenue'),interview_lead_days:Math.max(1,Number(f.get('ilead'))||5),interview_per_day:Math.max(1,Number(f.get('icap'))||20),interview_bring:f.get('ibring')});route()}catch(x){alert(x.message)}return false},
async st(id,s){if(s==='Approved'){if(!await ask('Approve this application?','The parent will receive an email with the registration number and an interview date. This cannot be undone.','Yes, approve'))return;const r=await A.mail('approve',id);alert(r?'Approved. Interview date: '+fd(r.interview_date)+(r.emailed?'. Email sent to the parent.':'. The email could not be sent. Fix the email settings, then use Resend email.'):'Could not approve. Please try again.')}else{if(!await ask('Reject this application?','The status will change to Rejected.','Yes, reject'))return;await A.setStatus(id,s)}route()},
async rs(id){if(!await ask('Resend the approval email?','The parent will receive the approval email again.','Yes, resend'))return;const r=await A.mail('resend',id);alert(r&&r.emailed?'Email sent.':'The email could not be sent. Check the email settings.');route()},
async csv(){const d=await A.admin(),k=['application_number','student_name','date_of_birth','gender','class_applied','hifz_level','previous_school','parent_name','parent_phone','address','status','registration_number','interview_date','created_at'];
 const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const t=[k.join(',')].concat(d.apps.map(a=>k.map(c=>q(a[c])).join(','))).join('\n');
 const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));l.download='annoor-applications.csv';l.click()}};
async function route(){const parts=location.hash.replace(/^#\/?/,'').split('/'),r=parts[0]||'home',a=parts.slice(1).join('/');
 if(['dash','pay','form','verify','done','admin','newpw'].includes(r)&&!U)return go('login');
 shell('<p class="mu">Loading\u2026</p>');try{shell(await(R[r]||R.home)(a))}catch(x){shell(`<div class="note">${esc(x.message)}</div>`)}scrollTo(0,0)}
(async()=>{try{await A.init()}catch(x){console.error(x)}
 const q=new URLSearchParams(location.search).get('reference');if(q){history.replaceState(null,'',location.pathname);location.hash='#/verify/'+q}else if(REC)location.hash='#/newpw';else if(/access_token|type=signup/.test(location.hash))location.hash='#/dash';
 addEventListener('hashchange',route);route()})();
</script></body></html>
